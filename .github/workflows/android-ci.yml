name: Android CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'

      - name: Run unit tests, Lint, and debug build
        run: bash ./gradlew --no-daemon --continue :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
